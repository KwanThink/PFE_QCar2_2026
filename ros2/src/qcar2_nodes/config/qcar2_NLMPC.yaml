qcar2_bezier:
  ros__parameters:
    frame_id: "map"
    base_frame: "base_link"
    publish_period: 1.0

    path_topic: "/bezier_path"
    marker_topic: "/bezier_markers"
    reference_topic: "/qcar2/reference_trajectory"

    heading_stride: 25
    heading_scale: 0.18
    show_control_polygon: true
    show_waypoints: true

    # QCar2 trajectory limits.
    L: 0.25725
    DT: 0.02
    VARPHI_MAX: 0.5236
    OMEGA_S_MAX: 2.0
    default_segment_time: 8.0

    # Static trajectory input.
    # "xyv"  : waypoints = [x, y, v, ...]. The node computes theta, varphi, omega_s.
    # "full" : waypoints = [x, y, theta, varphi, v, omega_s, ...].
    waypoint_format: "xyv"
    waypoints: [
       0.0,  0.0, 0.35,
      -1.0,  0.2, 0.35,
      -2.0,  0.2, 0.30,
      -3.5, -0.3, 0.05
    ]

    zero_endpoint_steering: true
    min_segment_time: 1.0
    time_safety_factor: 1.25
    segment_times: []

    # Optional simple RViz goal input. For real obstacle avoidance, keep using Nav2/global path
    # and provide collision-free waypoints to the Bezier generator.
    enable_goal_input: false
    goal_topic: "/goal_pose"
    goal_cruise_speed: 0.30
    goal_final_speed: 0.05
    minimum_goal_distance: 0.10

qcar2_nlmpc:
  ros__parameters:
    frame_id: "map"
    base_frame: "base_link"

    reference_topic: "/qcar2/reference_trajectory"
    cmd_topic: "/qcar2_cmd"

    # Must match the ACADO exporter unless you regenerate the solver.
    control_period: 0.10
    Npred: 12
    L: 0.25725

    # Input constraints: u = [v, omega_s]^T.
    # v_min is kept negative so NLMPC is allowed to use a small reverse command if required.
    v_min: -0.20
    v_max: 0.45
    omega_s_max: 2.0

    # State constraint: q = [x, y, theta, varphi]^T.
    varphi_max: 0.5236

    # Tracking weights: Q for states, R for inputs, P for terminal state.
    Q: [80.0, 80.0, 8.0, 2.0]
    R: [5.0, 1.0]
    P: [200.0, 200.0, 20.0, 5.0]

    goal_xy_tolerance: 0.08
    goal_yaw_tolerance: 0.20
    goal_index_margin: 10
    max_tracking_error: 0.80
    reference_timeout: 2.0
    tf_timeout: 0.20

    return_steering_to_zero_on_stop: true
    print_solver_timing: true
